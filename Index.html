<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17212b"><title>Pilotage vendeurs</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#17212b}header{background:#17212b;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px}header span{font-size:12px;opacity:.7}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}header button,.primary{background:#fff;color:#17212b}main{max-width:1200px;margin:auto;padding:15px}nav{display:flex;gap:8px;overflow:auto;margin-bottom:15px}nav button{background:#fff;white-space:nowrap}nav button.active{background:#17212b;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile,.card{background:#fff;border-radius:15px;padding:16px;box-shadow:0 2px 8px #0001}.tile{cursor:pointer}.tile:hover{transform:translateY(-2px)}.label{font-size:12px;color:#68737d}.number{font-size:30px;font-weight:800;margin:5px 0}.section{font-size:18px;font-weight:800;margin:22px 0 10px}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.person{cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stat{background:#f3f5f7;padding:8px;border-radius:8px;text-align:center;font-size:11px}.stat b{display:block;font-size:17px}.tablewrap{overflow:auto;background:#fff;border-radius:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.box{background:#fff;border-radius:16px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.box #x{float:right;background:#eee}.box input,.box select{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #ddd;border-radius:9px}@media(max-width:700px){.grid,.people{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.people{grid-template-columns:1fr 1fr}.number{font-size:25px}}</style></head><body>
<header><div><h1>📊 Pilotage vendeurs</h1><span>Chef des ventes</span></div><button id="add">＋ Activité</button></header>
<main><nav><button class="active" data-view="dashboard">Tableau de bord</button><button data-view="offers">Offres</button><button data-view="hot">Affaires chaudes</button><button data-view="late">Retards</button><button data-view="sellers">Vendeurs</button></nav><section id="app"></section></main>
<div id="modal" class="modal"><div class="box"><button id="x">✕</button><div id="modalBody"></div></div></div><script>const names=['Ayoub','Thibaut','Nicolas','Anne','Maxime','Isabelle','Julien'];const K='pilotage_web_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{s:{},offers:[]};names.forEach(n=>db.s[n]??={contacts:0,offers:0,rdv:0,sales:0,hot:0,late:0,target:12});const app=document.getElementById('app'),modal=document.getElementById('modal'),body=document.getElementById('modalBody');const save=()=>localStorage.setItem(K,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function totals(){return names.reduce((a,n)=>{Object.keys(a).forEach(k=>a[k]+=db.s[n][k]||0);return a},{contacts:0,offers:0,rdv:0,sales:0,hot:0,late:0})}
function dashboard(){let t=totals();app.innerHTML=`<div class="grid">${[['🚗 Ventes',t.sales,'sales'],['📋 Offres',t.offers,'offers'],['📞 Contacts',t.contacts,'contacts'],['📅 RDV',t.rdv,'rdv'],['🔥 Affaires chaudes',t.hot,'hot'],['⏰ Retards',t.late,'late']].map(x=>`<div class="tile" onclick="view('${x[2]}')"><div class="label">${x[0]}</div><div class="number">${x[1]}</div><div class="label">Cliquer pour ouvrir →</div></div>`).join('')}</div><div class="section">👥 Vendeurs</div><div class="people">${names.map(n=>{let d=db.s[n],p=Math.min(100,Math.round(d.sales/d.target*100));return `<div class="card person" onclick="seller('${n}')"><b>${n}</b><strong style="float:right">${p}%</strong><div class="stats"><div class="stat"><b>${d.sales}/${d.target}</b>Ventes</div><div class="stat"><b>${d.contacts}</b>Contacts</div><div class="stat"><b>${d.offers}</b>Offres</div><div class="stat"><b>${d.rdv}</b>RDV</div></div><p>🔥 ${d.hot} &nbsp; ⏰ ${d.late}</p></div>`}).join('')}</div>`}
function view(type){let labels={sales:'🚗 Ventes',offers:'📋 Offres',contacts:'📞 Contacts',rdv:'📅 RDV',hot:'🔥 Affaires chaudes',late:'⏰ Retards'};if(type==='offers')return offers();app.innerHTML=`<button onclick="dashboard()">← Retour</button><h2>${labels[type]}</h2><div class="tablewrap"><table class="table"><tr><th>Vendeur</th><th>Nombre</th></tr>${names.map(n=>`<tr><td>${n}</td><td>${db.s[n][type]}</td></tr>`).join('')}</table></div>`}
function offers(){app.innerHTML=`<button onclick="dashboard()">← Retour</button><h2>📋 Offres</h2><div class="tablewrap"><table class="table"><tr><th>Date</th><th>Client</th><th>Vendeur</th><th>Véhicule</th></tr>${db.offers.map(o=>`<tr><td>${esc(o.date)}</td><td>${esc(o.client)}</td><td>${esc(o.vendeur)}</td><td>${esc(o.vehicle)}</td></tr>`).join('')}</table></div>`}
function seller(n){let d=db.s[n];app.innerHTML=`<button onclick="dashboard()">← Retour</button><h2>👤 ${n}</h2><div class="grid">${[['Ventes',d.sales],['Contacts',d.contacts],['Offres',d.offers],['RDV',d.rdv],['Chaudes',d.hot],['Retards',d.late]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="number">${x[1]}</div></div>`).join('')}</div>`}
function activity(){body.innerHTML=`<button id="x2">✕</button><h2>＋ Activité</h2><label>Vendeur</label><select id="an">${names.map(n=>`<option>${n}</option>`).join('')}</select>${['contacts','offers','rdv','sales','hot','late'].map(k=>`<label>${k}</label><input id="${k}" type="number" min="0" value="0">`).join('')}<button class="primary" id="saveA">Enregistrer</button>`;modal.style.display='flex';document.getElementById('x2').onclick=close;document.getElementById('saveA').onclick=()=>{let d=db.s[an.value];['contacts','offers','rdv','sales','hot','late'].forEach(k=>d[k]+=+document.getElementById(k).value||0);save();close();dashboard()}}
function close(){modal.style.display='none'}document.getElementById('x').onclick=close;document.getElementById('add').onclick=activity;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');let v=b.dataset.view;v==='dashboard'?dashboard():v==='offers'?offers():v==='sellers'?view('sales'):view(v==='hot'?'hot':'late')});dashboard();</script></body></html>
